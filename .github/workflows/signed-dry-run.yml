name: Signed dry run

# The release pipeline's macOS and Windows packaging, signed and notarized with
# the real identities, WITHOUT publishing anything: no tag, no GitHub release,
# no update feed (latest*.yml never leaves the runner). It exists to prove a
# release would sign, notarize and launch BEFORE a tag is cut, which matters
# most when the payload changes (the bundled native runtime adds ~95 nested
# Mach-O files and ~100 PE files per arch).
#
# Steps mirror release.yml's macOS and Windows jobs one for one (toolchain,
# keychain, notarization key, the native-runtime fetch/stage, every
# verification); only `--publish never` and the version/draft steps differ.
# After signing, each job launches the SIGNED app with the native-runtime
# opt-in through the e2e spec: library validation and SmartScreen-relevant
# signatures are proven by a real first run, not inferred.

on:
  workflow_dispatch:
  push:
    branches: [native-runtime]

permissions:
  contents: read

concurrency:
  group: signed-dry-run-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  macos:
    name: Sign & notarize macOS (arm64 + x64), launch arm64 (no publish)
    # The signing identities exist only in the Vex repository.
    if: github.repository == 'Vex-Foundation/Vex'
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vex-app/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          check-latest: false
          cache: false

      - name: Verify pinned toolchain
        run: pnpm run verify:toolchain

      - name: Preflight - require signing, notarization and runtime secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VEX_NATIVE_RUNTIME_TOKEN: ${{ secrets.VEX_NATIVE_RUNTIME_TOKEN }}
        run: |
          missing=""
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER VEX_NATIVE_RUNTIME_TOKEN; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing. VEX_NATIVE_RUNTIME_TOKEN is a fine-grained token with read-only Contents access to the repository that hosts the native runtime release."
            exit 1
          fi

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install vex-app dependencies
        working-directory: vex-app
        run: pnpm install --frozen-lockfile
      - name: Build app
        working-directory: vex-app
        run: pnpm run build
      - name: Build Vex Studio bridge (darwin arm64 + amd64)
        run: |
          bash bridge/build.sh darwin arm64
          bash bridge/build.sh darwin amd64
      - name: Stage & verify bridge for packaging
        working-directory: vex-app
        run: node scripts/stage-bridge.mjs --platform mac --arch arm64 --arch x64
      - name: Stage & verify Lighter signer for packaging
        working-directory: vex-app
        run: node scripts/stage-lighter-signer.mjs --platform mac
      - name: Fetch & verify the native runtime (darwin arm64 + x64)
        working-directory: vex-app
        env:
          VEX_NATIVE_RUNTIME_TOKEN: ${{ secrets.VEX_NATIVE_RUNTIME_TOKEN }}
        run: node scripts/fetch-native-runtime.mjs --platform mac
      - name: Stage & verify the native runtime for packaging
        working-directory: vex-app
        run: node scripts/stage-native-runtime.mjs --platform mac --arch arm64 --arch x64

      - name: Prepare Apple notarization API key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_B64" | tr -d '\r\n' | base64 -d > "$key_path"
          test -s "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path"
          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      # Same keychain sequence as release.yml (see the reasoning there).
      - name: Import the Developer ID certificate into a build keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/vex-release.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "${CSC_LINK#*base64,}" | tr -d '\r\n' | base64 -d > "$certificate"
          test -s "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user | sed 's/^ *"//; s/"$//' | xargs security list-keychains -d user -s "$keychain"
          rm -f "$certificate"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package, sign & notarize (no publish)
        working-directory: vex-app
        run: pnpm exec electron-builder --mac --arm64 --x64 --publish never --config electron-builder.release.yml

      - name: Verify the packaged payload (incl. native runtime signatures)
        working-directory: vex-app
        run: pnpm run check:package
      - name: Verify notarization stapled to the .app bundles
        working-directory: vex-app
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist-electron/mac*/Vex.app)
          [ ${#apps[@]} -gt 0 ] || { echo "::error::No .app bundle produced"; exit 1; }
          for app in "${apps[@]}"; do
            xcrun stapler validate "$app"
            spctl -a -vvv -t exec "$app"
          done
      - name: Verify the embedded native runtime is signed by our team
        working-directory: vex-app
        run: |
          set -euo pipefail
          shopt -s nullglob
          for app in dist-electron/mac*/Vex.app; do
            team="$(codesign --display --verbose=2 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            [ -n "$team" ] && [ "$team" != "not set" ] || { echo "::error::$app carries no TeamIdentifier."; exit 1; }
            count=0
            while IFS= read -r -d '' f; do
              case "$(file -b "$f")" in *Mach-O*) ;; *) continue ;; esac
              case "$f" in */Contents/Resources/postgres/share/*) echo "::error::$f is a Mach-O under share/"; exit 1 ;; esac
              codesign --verify --strict "$f"
              got="$(codesign --display --verbose=2 "$f" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
              [ "$got" = "$team" ] || { echo "::error::$f is signed by team '$got', not '$team'."; exit 1; }
              count=$((count + 1))
            done < <(find "$app/Contents/Resources/postgres" "$app/Contents/Resources/llama" -type f -print0)
            [ "$count" -gt 0 ] || { echo "::error::No runtime Mach-O in $app"; exit 1; }
            echo "$app: $count native runtime Mach-O files signed by team $team."
          done

      # The proof that matters: the SIGNED, notarized, hardened app runs its
      # bundled Postgres and llama-server (library validation on) through a
      # real first run, model download included.
      - name: Launch the signed arm64 app on the native runtime
        working-directory: vex-app
        env:
          VEX_E2E_APP_EXECUTABLE: ${{ github.workspace }}/vex-app/dist-electron/mac-arm64/Vex.app/Contents/MacOS/Vex
        run: pnpm exec playwright test e2e/native-runtime.spec.ts --reporter=list

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: signed-dry-run-macos-report
          path: |
            vex-app/playwright-report
            vex-app/test-results
          retention-days: 7

  windows:
    name: Sign Windows (x64 + arm64), launch x64 (no publish)
    if: github.repository == 'Vex-Foundation/Vex'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vex-app/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          check-latest: false
          cache: false

      - name: Verify pinned toolchain
        run: pnpm run verify:toolchain

      - name: Preflight - require Azure signing and runtime secrets
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          VEX_NATIVE_RUNTIME_TOKEN: ${{ secrets.VEX_NATIVE_RUNTIME_TOKEN }}
        run: |
          missing=""
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET VEX_NATIVE_RUNTIME_TOKEN; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing."
            exit 1
          fi

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install vex-app dependencies
        working-directory: vex-app
        run: pnpm install --frozen-lockfile
      - name: Build app
        working-directory: vex-app
        run: pnpm run build
      - name: Build Vex Studio bridge (windows amd64 + arm64)
        shell: bash
        run: |
          bash bridge/build.sh windows amd64
          bash bridge/build.sh windows arm64
      - name: Stage & verify bridge for packaging
        working-directory: vex-app
        shell: bash
        run: node scripts/stage-bridge.mjs --platform win --arch x64 --arch arm64
      - name: Stage & verify Lighter signer for packaging
        working-directory: vex-app
        run: node scripts/stage-lighter-signer.mjs --platform win
      - name: Fetch & verify the native runtime (win32 x64 + arm64)
        working-directory: vex-app
        env:
          VEX_NATIVE_RUNTIME_TOKEN: ${{ secrets.VEX_NATIVE_RUNTIME_TOKEN }}
        run: node scripts/fetch-native-runtime.mjs --platform win
      - name: Stage & verify the native runtime for packaging
        working-directory: vex-app
        run: node scripts/stage-native-runtime.mjs --platform win --arch x64 --arch arm64

      - name: Package & sign (no publish)
        working-directory: vex-app
        run: pnpm exec electron-builder --win --x64 --arm64 --publish never --config electron-builder.release.yml
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Verify the packaged payload (incl. native runtime signatures)
        working-directory: vex-app
        run: pnpm run check:package
      - name: Verify Authenticode on every produced .exe
        working-directory: vex-app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path dist-electron -Filter *.exe -Recurse
          if ($files.Count -eq 0) { Write-Error "No .exe produced in dist-electron" }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') { Write-Error "Not Valid: $($f.FullName): $($sig.Status)" }
            if ($sig.SignerCertificate.Subject -notmatch 'VEX LABS PTE\. LTD\.') { Write-Error "Unexpected signer for $($f.FullName): $($sig.SignerCertificate.Subject)" }
            if (-not $sig.TimeStamperCertificate) { Write-Error "No RFC3161 timestamp on $($f.FullName)" }
          }
          Write-Host "$($files.Count) .exe files signed, timestamped and attributed to VEX LABS."
      - name: Verify the packaged native runtime DLLs are Microsoft-signed or lock-bound unsigned
        working-directory: vex-app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($root in @(Get-ChildItem -Path dist-electron -Directory -Filter 'win*-unpacked')) {
            $microsoft = 0; $unsigned = 0
            foreach ($tree in @('postgres', 'llama')) {
              foreach ($f in @(Get-ChildItem -Path (Join-Path $root.FullName "resources\$tree") -Recurse -File -Filter *.dll)) {
                $sig = Get-AuthenticodeSignature $f.FullName
                if ($sig.Status -eq 'NotSigned') { $unsigned++; continue }
                if ($sig.Status -eq 'Valid' -and $sig.SignerCertificate.Subject -match 'O=Microsoft Corporation') { $microsoft++; continue }
                Write-Error "$($f.FullName): $($sig.Status) $($sig.SignerCertificate.Subject)"
              }
            }
            Write-Host "$($root.Name): $microsoft Microsoft-signed and $unsigned lock-bound unsigned runtime DLLs."
          }

      - name: Launch the signed x64 app on the native runtime
        working-directory: vex-app
        env:
          VEX_E2E_APP_EXECUTABLE: ${{ github.workspace }}\vex-app\dist-electron\win-unpacked\Vex.exe
        run: pnpm exec playwright test e2e/native-runtime.spec.ts --reporter=list

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: signed-dry-run-windows-report
          path: |
            vex-app/playwright-report
            vex-app/test-results
          retention-days: 7
