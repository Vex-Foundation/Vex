# Vex — release pipeline (Wave 4).
#
# Builds, signs, notarizes, and publishes the desktop app to GitHub Releases on
# a version tag. Three independent jobs run in parallel on OS-native runners:
#   - macOS  (macos-latest): dmg + zip, arm64 AND x64, Developer ID signed +
#     notarized. Consumes the 5 Apple/signing secrets.
#   - Linux  (ubuntu-latest): AppImage + deb, x64, unsigned. Needs no signing
#     secrets, so it ships even while Apple account approval is pending
#     (owner-agreed strategy — Linux is independent of macOS/Apple delays).
#   - Windows (windows-latest): NSIS installer, x64, signed + RFC3161
#     timestamped via Azure Trusted Signing (electron-builder azureSignOptions,
#     account vexlabssigning / profile vex-app-signing). Consumes the 3 Azure
#     secrets.
#
# electron-updater (GitHub provider) consumes latest-mac.yml / latest-linux.yml
# / latest.yml (Windows) that electron-builder emits into each release. The packaged app auto-loads the
# app-update.yml electron-builder generates from the `publish` block in
# vex-app/electron-builder.release.yml — no feed URL is hardcoded in app source.
#
# ── RELEASE PROCEDURE (3 commands) ─────────────────────────────────────────
#   1. Bump the version in vex-app/package.json (e.g. 0.1.0 -> 0.1.1).
#      It MUST be strictly higher than the last release and MUST equal the tag
#      below (a guard step enforces tag == vex-app/package.json version).
#   2. git tag v0.1.1
#   3. git push origin v0.1.1
#   Then, in GitHub, review the DRAFT release (confirm signed+notarized macOS
#   artifacts and both latest-*.yml uploaded), add notes, and click
#   "Publish release". Users' updaters only see PUBLISHED releases.
#   (To make publish fully zero-touch, set publish.releaseType: release in
#   vex-app/electron-builder.release.yml.)
#
# ── REQUIRED REPOSITORY SECRETS (Settings -> Secrets and variables -> Actions) ─
#   CSC_LINK           Developer ID Application cert (.p12) base64-encoded
#   CSC_KEY_PASSWORD   password protecting that .p12
#   APPLE_API_KEY_B64  App Store Connect API key (.p8) base64-encoded (notarytool)
#   APPLE_API_KEY_ID   App Store Connect API Key ID
#   APPLE_API_ISSUER   App Store Connect Issuer ID (UUID)
#   AZURE_TENANT_ID    Entra tenant id (Windows signing, EnvironmentCredential)
#   AZURE_CLIENT_ID    appId of the vex-github-signing service principal
#   AZURE_CLIENT_SECRET client secret of that principal (github-actions-release-4,
#                      expires 2028-08-09 - when it lapses the windows job fails
#                      with a 401; rotate in Entra and update this secret)
#   GITHUB_TOKEN       provided automatically by Actions (no setup)

name: Release

on:
  push:
    tags:
      - "v*"

# Creating the GitHub Release and uploading assets needs write access to contents.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release gate: run the vex-app unit suite BEFORE anything else. create-release
  # needs this job, so a RED test blocks the whole pipeline (no draft, no signing,
  # no publish). Scope is deliberately vex-app `pnpm test` only — the root suite
  # needs testcontainers and the e2e suite needs a display, neither of which fit a
  # fast pre-release gate.
  test:
    name: Unit tests (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vex-app/pnpm-lock.yaml

      - name: Verify pinned toolchain
        run: pnpm run verify:toolchain

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install vex-app dependencies
        working-directory: vex-app
        run: pnpm install --frozen-lockfile

      - name: Audit root production dependencies
        run: pnpm run audit:deps

      - name: Audit vex-app production dependencies
        working-directory: vex-app
        run: pnpm run audit:deps

      - name: Run vex-app unit tests
        working-directory: vex-app
        run: pnpm test

  # Serialize DRAFT-RELEASE CREATION only (Codex review finding): electron-publish
  # has no retry-on-422 for simultaneous createRelease() calls, so two parallel
  # jobs racing to create the same draft can fail. This job creates the draft
  # idempotently up front; both build jobs then find-and-upload (get-or-upload is
  # safe per-asset). Builds themselves stay parallel and Linux stays independent
  # of Apple delays.
  create-release:
    name: Create draft release (idempotent)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure a DRAFT release exists for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # FAIL CLOSED ON A PUBLISHED RELEASE. This step used to accept ANY
          # existing release for the tag, and the build jobs then publish with
          # electron-builder's `releaseType: release`, which finds the release
          # and OVERWRITES its assets. A rerun of this workflow against a tag
          # whose release was already published therefore replaced shipped,
          # signed artifacts - and it did so BEFORE the signature and
          # notarization checks later in this workflow could object. Users on
          # auto-update would have been served the new bytes.
          #
          # A draft is the only safe target: nothing has been distributed from
          # it yet. Anything else stops here and the operator cuts a new tag.
          if state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME already exists and is PUBLISHED, not a draft. This workflow would overwrite its assets, including artifacts users may already have downloaded or auto-updated to. Bump the version and cut a new tag instead."
              exit 1
            fi
            echo "Draft release $GITHUB_REF_NAME already exists - reusing it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes "Draft created by release workflow; electron-builder uploads artifacts."
            echo "Draft release $GITHUB_REF_NAME created."
          fi

  macos:
    name: Build, sign, notarize & publish macOS (arm64 + x64)
    needs: create-release
    runs-on: macos-latest
    # 120 (not 60): Apple's FIRST notarization on a new account is held for
    # "additional analysis", and notarytool --wait has no timeout — the initial
    # v0.1.0 run hit the 60-min cap mid-notarization. Keep this a SINGLE job
    # building both arches: a parallel per-arch matrix would last-writer-win
    # latest-mac.yml and drop an arch (breaking auto-update).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # pnpm version is read from the root package.json "packageManager" field
      # (pnpm@10.32.1) — do NOT also pass `version:` or action-setup errors on a
      # double-specified version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vex-app/pnpm-lock.yaml

      # Pinned by full commit SHA (v7.0.0). The Vex Studio bridge is a compiled
      # binary that ships INSIDE the signed bundle, so the action that installs
      # its toolchain is release-critical; a moving tag is not an acceptable
      # pin for it. `go-version` is the EXACT patch, and bridge/build.sh
      # refuses anything else with GOTOOLCHAIN=local.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          check-latest: false
          # Cache deliberately OFF even though bridge/go.sum exists: the module
          # graph is github.com/Microsoft/go-winio (the Windows pipe front's
          # only third-party dependency) plus golang.org/x/sys, downloaded in
          # seconds and verified against the committed go.sum on every run. A
          # restored cache would be one more input to a binary that ships
          # inside the signed bundle. vex-mcp itself links no third-party
          # package (the import-graph test in bridge/ pins that).
          cache: false

      - name: Verify pinned toolchain
        run: pnpm run verify:toolchain

      - name: Verify tag matches vex-app/package.json version
        working-directory: vex-app
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match vex-app/package.json version $PKG — bump the version before tagging."
            exit 1
          fi
          echo "Version OK: $PKG"

      # electron-builder 26 SILENTLY skips notarization (only a warning) when the
      # Apple env vars are missing, and forceCodeSigning only catches a missing
      # cert — so without this guard a missing secret would publish a signed but
      # UN-notarized ("app is damaged") build. Fail closed instead. Until Apple
      # creds exist this intentionally fails the macOS job while Linux still
      # ships (owner-agreed: Linux is independent of Apple approval).
      - name: Preflight — require signing & notarization secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required macOS release secret(s):$missing — add them in repo Settings -> Secrets and variables -> Actions. (Linux releases do not need these.)"
            exit 1
          fi
          echo "All macOS signing/notarization secrets present."

      # Monorepo (NOT a pnpm workspace): the @vex-lib / @vex-agent aliases bundle
      # root agent/shared code into vex-app's main process, so root node_modules
      # must exist at build time. Install BOTH trees.
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install vex-app dependencies
        working-directory: vex-app
        run: pnpm install --frozen-lockfile

      # Full app build chain (same as `pnpm --dir vex-app make` up to packaging):
      # build:assets (migrations + Lighter signer helper binaries) -> lint +
      # process-boundary check -> build main/preload/renderer -> check-build-artifacts.
      - name: Build app
        working-directory: vex-app
        run: pnpm run build

      # The bridge is built BEFORE electron-builder, for BOTH architectures the
      # macOS job packages in one invocation. electron-builder 26 only warns on
      # a missing extraResources source, so a package produced without this step
      # would ship with no bridge and no error.
      - name: Build Vex Studio bridge (darwin arm64 + amd64)
        run: |
          bash bridge/build.sh darwin arm64
          bash bridge/build.sh darwin amd64

      - name: Stage & verify bridge for packaging
        working-directory: vex-app
        run: node scripts/stage-bridge.mjs --platform mac --arch arm64 --arch x64

      # Method B notarization: decode the App Store Connect API key (.p8) to an
      # ephemeral file and expose its PATH + the key id/issuer via $GITHUB_ENV.
      # notarytool reads APPLE_API_KEY (path) + APPLE_API_KEY_ID + APPLE_API_ISSUER
      # from the environment. umask 077 keeps the key private; the non-empty +
      # PEM-header checks catch a corrupt/empty decode without printing the secret.
      # `base64 -d` is portable on macOS (GNU-only `--decode` is not available).
      - name: Prepare Apple notarization API key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_B64" | tr -d '\r\n' | base64 -d > "$key_path"
          test -s "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path"
          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      # Replaces `make`'s `electron-builder --publish never` with the signed,
      # notarized, publishing invocation using the production release profile.
      # Signing: CSC_LINK / CSC_KEY_PASSWORD. Notarization (Method B): APPLE_API_KEY
      # + APPLE_API_KEY_ID + APPLE_API_ISSUER flow in from the previous step via
      # $GITHUB_ENV — do NOT re-declare them here (an empty ${{ env.* }} override
      # would blank the decoded key path).
      # The native-payload contract runs inside afterPack (build/afterPack.mjs)
      # for every packaged arch, BEFORE signing and publish - the release path
      # deliberately relies on that hook instead of a separate check:package step.
      - name: Package, sign, notarize & publish
        working-directory: vex-app
        run: pnpm exec electron-builder --mac --arm64 --x64 --publish always --config electron-builder.release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # Fail closed if notarization did not staple. electron-builder notarizes and
      # staples the .app BUNDLE (not the DMG artifact) on the mac/dmg path, so
      # validate the per-arch .app bundles — validating the DMGs would false-fail
      # (Codex final-review fix). Runs after --publish uploaded to the DRAFT, which
      # stays invisible until the owner publishes it.
      - name: Verify notarization stapled to the .app bundles
        working-directory: vex-app
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist-electron/mac*/Vex.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No .app bundle produced in dist-electron/mac* — packaging/signing likely failed."
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "stapler validate: $app"
            xcrun stapler validate "$app"
            spctl -a -vvv -t exec "$app"
          done

      # The embedded bridge carries its OWN signature (mac.binaries in the
      # release profile). The bundle-level stapler check above does not prove
      # it: an unsigned nested Mach-O fails at launch under the hardened
      # runtime, not at package time. Assert the file is present, is a Mach-O,
      # and verifies.
      - name: Verify the embedded Vex Studio bridge is signed
        working-directory: vex-app
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist-electron/mac*/Vex.app)
          for app in "${apps[@]}"; do
            bridge="$app/Contents/Resources/bridge/vex-mcp"
            if [ ! -f "$bridge" ]; then
              echo "::error::No Vex Studio bridge at $bridge - the package would ship without it."
              exit 1
            fi
            file "$bridge"
            codesign --verify --strict --verbose=2 "$bridge"
            codesign --display --verbose=2 "$bridge"
          done
          echo "Embedded bridge signed and verified in every .app bundle."

  linux:
    name: Build & publish Linux (x64)
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vex-app/pnpm-lock.yaml

      # Pinned by full commit SHA (v7.0.0). The Vex Studio bridge is a compiled
      # binary that ships INSIDE the signed bundle, so the action that installs
      # its toolchain is release-critical; a moving tag is not an acceptable
      # pin for it. `go-version` is the EXACT patch, and bridge/build.sh
      # refuses anything else with GOTOOLCHAIN=local.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          check-latest: false
          # Cache deliberately OFF even though bridge/go.sum exists: the module
          # graph is github.com/Microsoft/go-winio (the Windows pipe front's
          # only third-party dependency) plus golang.org/x/sys, downloaded in
          # seconds and verified against the committed go.sum on every run. A
          # restored cache would be one more input to a binary that ships
          # inside the signed bundle. vex-mcp itself links no third-party
          # package (the import-graph test in bridge/ pins that).
          cache: false

      - name: Verify pinned toolchain
        run: pnpm run verify:toolchain

      - name: Verify tag matches vex-app/package.json version
        working-directory: vex-app
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match vex-app/package.json version $PKG — bump the version before tagging."
            exit 1
          fi
          echo "Version OK: $PKG"

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install vex-app dependencies
        working-directory: vex-app
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: vex-app
        run: pnpm run build

      - name: Build Vex Studio bridge (linux amd64)
        run: bash bridge/build.sh linux amd64

      - name: Stage & verify bridge for packaging
        working-directory: vex-app
        run: node scripts/stage-bridge.mjs --platform linux --arch x64

      # No signing env on Linux (AppImage/deb are unsigned). --linux with no arch
      # flag uses the release profile's arch list (x64). electron-updater feed is
      # latest-linux.yml. Publishes to the SAME tagged draft release as the macOS
      # job (parallel by design — Linux is not gated on macOS/Apple).
      - name: Package & publish
        working-directory: vex-app
        run: pnpm exec electron-builder --linux --publish always --config electron-builder.release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Build, sign & publish Windows (x64)
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vex-app/pnpm-lock.yaml

      # Pinned by full commit SHA (v7.0.0). The Vex Studio bridge is a compiled
      # binary that ships INSIDE the signed bundle, so the action that installs
      # its toolchain is release-critical; a moving tag is not an acceptable
      # pin for it. `go-version` is the EXACT patch, and bridge/build.sh
      # refuses anything else with GOTOOLCHAIN=local.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          check-latest: false
          # Cache deliberately OFF even though bridge/go.sum exists: the module
          # graph is github.com/Microsoft/go-winio (the Windows pipe front's
          # only third-party dependency) plus golang.org/x/sys, downloaded in
          # seconds and verified against the committed go.sum on every run. A
          # restored cache would be one more input to a binary that ships
          # inside the signed bundle. vex-mcp itself links no third-party
          # package (the import-graph test in bridge/ pins that).
          cache: false

      - name: Verify pinned toolchain
        run: pnpm run verify:toolchain

      - name: Verify tag matches vex-app/package.json version
        working-directory: vex-app
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match vex-app/package.json version $PKG - bump the version before tagging."
            exit 1
          fi
          echo "Version OK: $PKG"

      # Fail closed BEFORE the ~15-minute build: a missing Azure credential
      # otherwise surfaces as a confusing TrustedSigning/signtool error deep
      # inside packaging. forceCodeSigning only catches a FAILED sign attempt,
      # not an absent credential.
      - name: Preflight - require Azure signing credentials
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          missing=""
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required Windows signing secret(s):$missing - add them in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Azure signing credentials present."

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install vex-app dependencies
        working-directory: vex-app
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: vex-app
        run: pnpm run build

      # bash on windows-latest is Git Bash, which runs the wrapper unchanged.
      - name: Build Vex Studio bridge (windows amd64)
        shell: bash
        run: bash bridge/build.sh windows amd64

      - name: Stage & verify bridge for packaging
        working-directory: vex-app
        shell: bash
        run: node scripts/stage-bridge.mjs --platform win --arch x64

      # app-builder-lib's WindowsSignAzureManager authenticates through
      # DefaultAzureCredential's EnvironmentCredential using these three vars.
      # Verified in the installed 26.8.1: initialize() hard-requires
      # AZURE_TENANT_ID + AZURE_CLIENT_ID plus a secret/certificate credential,
      # so an azure/login OIDC session alone CANNOT satisfy it - switching to
      # OIDC needs upstream electron-builder support first. The same manager
      # applies the RFC3161 timestamp (pinned in the release profile).
      - name: Package, sign & publish
        working-directory: vex-app
        run: pnpm exec electron-builder --win --x64 --publish always --config electron-builder.release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Windows analogue of the macOS stapler/spctl gate. Fail closed if any
      # produced .exe is unsigned, untimestamped, or attributed to the wrong
      # publisher. Runs after --publish uploaded to the DRAFT release, which
      # stays invisible to updaters until the owner publishes it.
      - name: Verify Authenticode signature
        working-directory: vex-app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path dist-electron -Filter *.exe -Recurse
          if ($files.Count -eq 0) {
            Write-Error "No .exe produced in dist-electron - packaging failed."
          }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) | $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature not Valid for $($f.Name): $($sig.Status)"
            }
            if ($sig.SignerCertificate.Subject -notmatch 'VEX LABS PTE\. LTD\.') {
              Write-Error "Unexpected signer for $($f.Name): $($sig.SignerCertificate.Subject)"
            }
            if (-not $sig.TimeStamperCertificate) {
              Write-Error "No RFC3161 timestamp on $($f.Name) - an untimestamped signature dies with the ~72h Trusted Signing leaf cert."
            }
          }
          Write-Host "All Windows artifacts signed, timestamped and attributed correctly."

      # Bridge-path-specific assertion, on top of the recursive check above:
      # the recursive scan walks dist-electron/*.exe, and the bridge binaries
      # live inside the unpacked app directory. A missing or misnamed one would
      # otherwise pass every gate and fail only in a user's MCP client.
      #
      # BOTH artifacts are required, BY NAME. On Windows `resources/bridge/`
      # carries the MCP bridge AND the named-pipe front (the artifact table in
      # vex-app/scripts/bridge-artifact.mjs), and a scan that looked for one
      # name would pass a package that shipped only that one. The Authenticode
      # step above already covers the front: app-builder-lib signs every .exe
      # copied through extraResources (winPackager.js shouldSignFile, the
      # `.exe` backward-compatibility branch) with no per-file configuration.
      - name: Verify the packaged Vex Studio bridge binaries (Windows)
        working-directory: vex-app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('vex-mcp.exe', 'vex-pipe-front.exe')) {
            $found = Get-ChildItem -Path dist-electron -Recurse -Filter $name -ErrorAction SilentlyContinue
            if ($found.Count -eq 0) {
              Write-Error "No resources/bridge/$name in dist-electron - the package would ship without it."
            }
            $expected = 'resources\\bridge\\' + [regex]::Escape($name) + '$'
            foreach ($b in $found) {
              if ($b.FullName -notmatch $expected) {
                Write-Error "Unexpected bridge location $($b.FullName); the contract path is resources/bridge/$name."
              }
              Write-Host "bridge: $($b.FullName) ($($b.Length) bytes)"
            }
          }
          Write-Host "Packaged Vex Studio bridge binaries present at the contract paths."
