appId: ai.projectvex.app
productName: Vex
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Internal unsigned dev/test packaging only. Public production releases must use
# a separate signed release profile with forceCodeSigning: true, macOS
# notarization, Windows signature verification, checksums, and updater metadata.
forceCodeSigning: false

asar: true
electronUpdaterCompatibility: ">=2.16"
afterPack: ./build/afterPack.mjs

# Do NOT rebuild native dependencies. Every native dependency here (node-pty,
# @parcel/watcher, bufferutil, utf-8-validate) ships Node-API prebuilds, and a
# rebuild would plant a SECOND loadable artifact that
# outranks the reviewed one in node-pty's own search order (build/Release before
# prebuilds/) while sitting outside the asarUnpack and mac.binaries contracts
# below. The policy, the measured loader orders and the excluded candidates live
# in scripts/native-payload-contract.mjs; scripts/check-native-artifacts.mjs
# fails if this file drifts from it.
npmRebuild: false

directories:
  output: dist-electron
  buildResources: build

files:
  - dist/main/**
  - dist/preload/**
  - dist/pty-host/**
  - dist/renderer/**
  - package.json
  # Exclude sourcemaps from packaged artifacts (security + size).
  - "!dist/**/*.map"
  - "!dist/**/*.tsbuildinfo"
  # ONE loadable candidate per native module. These two directories are the
  # NON-selected candidates; leaving them in the payload would let a loader
  # pick an artifact the unpack and signing contracts never covered. app-builder
  # applies negated `files` patterns to the node_modules copy too, which is what
  # makes these effective (fileMatcher.js getNodeModuleFileMatcher).
  - "!**/node-pty/build/**"
  - "!**/@parcel/watcher/build/**"
  # bufferutil and utf-8-validate are the optional `ws` accelerators (pulled in
  # by @solana/web3.js and viem). node-gyp-build searches build/Release BEFORE
  # prebuilds/, exactly like node-pty, so a leftover local build would outrank
  # the published Node-API prebuild and ship a binary compiled on a developer's
  # machine into the payload.
  - "!**/bufferutil/build/**"
  - "!**/utf-8-validate/build/**"

# Native modules must live OUTSIDE app.asar. Neither can be loaded from inside
# an archive: node-pty's loader resolves `prebuilds/<platform>-<arch>/pty.node`
# by real filesystem path and on macOS spawns the sibling `spawn-helper`
# executable, and @parcel/watcher dlopens `watcher.node` from the per-platform
# optional package, which is the first entry in its own search order. These are
# the SELECTED candidates; the payload is verified against them by
# scripts/check-packaged-payload.mjs.
asarUnpack:
  - node_modules/node-pty/prebuilds/**
  - node_modules/@parcel/watcher-*/**
  # The ws accelerators' Node-API prebuilds. electron-builder auto-unpacks
  # `.node` files even without a glob, so these were already outside the asar by
  # an undeclared default; naming them puts them under the reviewed contract the
  # payload gate asserts. Absence for a target upstream publishes no prebuild
  # for is a tolerated degrade to ws's pure-JS path, not a failure.
  - node_modules/bufferutil/prebuilds/**
  - node_modules/utf-8-validate/prebuilds/**

extraResources:
  - from: resources/compose
    to: compose
    filter: ["**/*"]
  - from: resources/migrations
    to: migrations
    filter: ["**/*.sql"]
  # The Vex Studio MCP bridge, staged for THIS platform/arch by
  # `scripts/stage-bridge.mjs` before electron-builder runs. Staged rather than
  # read straight from `bridge/dist/<goos>-<goarch>/` because electron-builder's
  # Go output is named in Go's vocabulary (amd64) while `${arch}` here speaks
  # Electron's (x64); the mapping lives in one script that also verifies the
  # bytes. The `${arch}` suffix is what makes the macOS job correct - it
  # packages arm64 and x64 in ONE electron-builder invocation, so a single
  # shared staging directory would put one architecture's bridge in the
  # other's bundle. electron-builder 26 only WARNS on a
  # missing source, so the preflight and the afterPack re-inspection are what
  # actually make this fail closed.
  - from: resources/bridge-${arch}
    to: bridge
    filter: ["**/*"]

mac:
  category: public.app-category.finance
  # The embedded Vex Studio bridge is a Mach-O executable inside the bundle, so
  # it must carry its own signature or the hardened runtime refuses to launch it
  # and notarization rejects the bundle. `binaries` is electron-builder's
  # supported mechanism for exactly this; the path is relative to the .app and
  # is resolved by app-builder-lib against the bundle root.
  binaries:
    - Contents/Resources/bridge/vex-mcp
    # node-pty's `spawn-helper` is a Mach-O executable with NO file extension,
    # so @electron/osx-sign's default nested-binary walker does not pick it up
    # (it does sign the `.node` files). Unsigned, the hardened runtime refuses
    # to exec it and every terminal spawn fails on macOS. Both arches are
    # listed because node-pty ships prebuilds for both and electron-builder
    # packages x64 and arm64 in ONE invocation.
    - Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-x64/spawn-helper
    - Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Dev/test only. Production release config must set this to true.
  notarize: false
  icon: build/icon.icns

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # Dev/test only. Production release config must set this to true.
  verifyUpdateCodeSignature: false
  icon: build/icon.ico

linux:
  category: Finance
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  # Single high-res PNG — electron-builder fans out to hicolor sizes
  # (16/32/48/64/128/256/512/1024) for AppImage and deb packaging.
  icon: build/icon.png
