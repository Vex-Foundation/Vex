# Vex — PRODUCTION / RELEASE electron-builder profile.
#
# Signed + notarized public releases published to GitHub Releases and consumed
# by electron-updater. This is intentionally SEPARATE from the default
# `electron-builder.yml` (internal unsigned dev/test packaging) so the dev flow
# — `pnpm --dir vex-app make` / `package` — keeps working untouched. Passing
# `--config electron-builder.release.yml` REPLACES the default config, so this
# file is self-contained.
#
# Release matrix (owner-agreed 2026-07-05, see vex-expand/dystrybucja-macos-github.md
# §"Ustalenia platformowe"): macOS arm64 + x64 (Developer ID + notarization,
# two separate per-arch artifacts), Windows x64 (NSIS, Azure Trusted Signing,
# added 2026-08) and Linux x64 (AppImage + deb, unsigned).
#
# Secrets are read from the CI ENVIRONMENT ONLY — never stored in this repo:
#   CSC_LINK            Developer ID Application cert (.p12, base64)
#   CSC_KEY_PASSWORD    password protecting that .p12
#   APPLE_API_KEY       path to the App Store Connect API key (.p8); the release
#                       workflow decodes APPLE_API_KEY_B64 to a temp file and sets it
#   APPLE_API_KEY_ID    App Store Connect API Key ID (notarytool)
#   APPLE_API_ISSUER    App Store Connect Issuer ID (notarytool)
#   AZURE_TENANT_ID     Entra tenant id (Windows signing, EnvironmentCredential)
#   AZURE_CLIENT_ID     service principal appId (Windows signing)
#   AZURE_CLIENT_SECRET service principal secret (Windows signing)
#   GH_TOKEN            GitHub Releases upload (CI: secrets.GITHUB_TOKEN)

# appId: permanent app-identity / auto-updater / userData contract. Locked to
# ai.projectvex.app (reverse-DNS of app.projectvex.ai) by owner decision before
# the first tag. MUST NOT change after the first published release — a changed
# appId breaks auto-update for every installed client and orphans their userData.
appId: ai.projectvex.app
productName: Vex

# Versioned + arch-unique names. Versioned (NOT versionless) is deliberate:
# electron-updater's differential/blockmap download and on-disk cache key off
# per-version file names, so reusing a fixed name across releases can corrupt
# update caching. The landing page therefore resolves the newest asset via the
# GitHub "latest release" page/API (see .github/workflows/release.yml header),
# not a fixed `/releases/latest/download/<name>` link.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Production MUST be signed. Fails the build if a signing identity is missing on
# a code-signed platform (macOS and Windows here) — prevents an accidental
# unsigned release. No-op for Linux targets (AppImage/deb are not code-signed).
forceCodeSigning: true

asar: true
electronUpdaterCompatibility: ">=2.16"
# Flips Electron fuses (RunAsNode off, ASAR integrity on, ...) BEFORE codesign.
afterPack: ./build/afterPack.mjs

directories:
  output: dist-electron
  buildResources: build

files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
  # Exclude sourcemaps from packaged artifacts (security + size).
  - "!dist/**/*.map"
  - "!dist/**/*.tsbuildinfo"

extraResources:
  - from: resources/compose
    to: compose
    filter: ["**/*"]
  - from: resources/migrations
    to: migrations
    filter: ["**/*.sql"]
  # The Vex Studio MCP bridge, staged for THIS platform/arch by
  # `scripts/stage-bridge.mjs` before electron-builder runs. Staged rather than
  # read straight from `bridge/dist/<goos>-<goarch>/` because electron-builder's
  # Go output is named in Go's vocabulary (amd64) while `${arch}` here speaks
  # Electron's (x64); the mapping lives in one script that also verifies the
  # bytes. The `${arch}` suffix is what makes the macOS job correct - it
  # packages arm64 and x64 in ONE electron-builder invocation, so a single
  # shared staging directory would put one architecture's bridge in the
  # other's bundle. electron-builder 26 only WARNS on a
  # missing source, so the preflight and the afterPack re-inspection are what
  # actually make this fail closed.
  - from: resources/bridge-${arch}
    to: bridge
    filter: ["**/*"]

mac:
  category: public.app-category.finance
  # The embedded Vex Studio bridge is a Mach-O executable inside the bundle, so
  # it must carry its own signature or the hardened runtime refuses to launch it
  # and notarization rejects the bundle. `binaries` is electron-builder's
  # supported mechanism for exactly this; the path is relative to the .app and
  # is resolved by app-builder-lib against the bundle root.
  binaries:
    - Contents/Resources/bridge/vex-mcp
  target:
    - target: dmg # human-facing installer UX
      arch: [arm64, x64]
    - target: zip # REQUIRED by electron-updater on macOS (dmg alone is not enough)
      arch: [arm64, x64]
  icon: build/icon.icns
  hardenedRuntime: true # required for notarization
  gatekeeperAssess: false
  # Reuses the repo's deliberately security-hardened entitlements (same files the
  # dev profile uses): allow-jit (V8) + network.client are ON;
  # allow-unsigned-executable-memory and disable-library-validation stay OFF.
  # Production deps are pure-JS (viem/pg/solana — no native modules per the owner
  # spec), so the looser electron-builder default entitlements set is not needed,
  # and keeping it tight is the right posture for a self-custodial wallet.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # electron-builder 26 takes `notarize` as a BOOLEAN (boolean-only schema in this
  # version). notarytool auth comes from the ENVIRONMENT: with APPLE_API_KEY (path
  # to the .p8) + APPLE_API_KEY_ID + APPLE_API_ISSUER set, it uses the App Store
  # Connect API key (Method B). NOTE: if those env vars are absent it SKIPS
  # notarization with only a warning — the release workflow's preflight fails fast
  # beforehand so an un-notarized build is never published.
  notarize: true

win:
  target:
    - target: nsis # electron-updater's Windows path (emits latest.yml + blockmap)
      arch: [x64] # x64 only for the first Windows release; arm64 later
  icon: build/icon.ico
  # electron-updater compares the publisher of a downloaded update against
  # azureSignOptions.publisherName before installing. true is the default -
  # pinned explicitly because the release profile must never flip it off.
  verifyUpdateCodeSignature: true
  # Azure Trusted Signing via electron-builder's native path. Signing happens
  # INSIDE the build: latest.yml sha512 hashes are computed AFTER signing, so a
  # post-build signing step would corrupt auto-update for every client - never
  # add one. Auth comes from the CI environment only (EnvironmentCredential):
  # AZURE_TENANT_ID + AZURE_CLIENT_ID + AZURE_CLIENT_SECRET.
  azureSignOptions:
    # MUST equal the certificate Subject CN character-for-character, including
    # the trailing period after "LTD" - verified against the live certificate
    # profile 2026-08-08. Do not alter, do not "tidy". A mismatch makes every
    # installed app silently refuse its own updates. This value is also written
    # into app-update.yml as the publisherName electron-updater verifies
    # downloaded installers against (app-builder-lib PublishManager).
    publisherName: "VEX LABS PTE. LTD."
    endpoint: https://eus.codesigning.azure.net/
    codeSigningAccountName: vexlabssigning
    certificateProfileName: vex-app-signing
    # app-builder-lib 26.8.1 defaults both keys to exactly these values; pinned
    # so an electron-builder upgrade cannot silently drop timestamping. Trusted
    # Signing leaf certs live ~72h - an untimestamped signature dies with them
    # and Defender then flags the binary.
    timestampRfc3161: http://timestamp.acs.microsoft.com
    timestampDigest: SHA256

linux:
  category: Finance
  # TODO(owner): confirm a REAL contact address you control — this string is
  # embedded in every published .deb. Do NOT use a personal email.
  maintainer: Vex Foundation <contact@projectvex.ai>
  vendor: Vex Foundation
  # Single high-res PNG — electron-builder fans out to hicolor sizes for
  # AppImage and deb packaging.
  icon: build/icon.png
  target:
    - target: AppImage # broad direct download + auto-update via latest-linux.yml
      arch: [x64]
    - target: deb # Debian/Ubuntu package-manager install
      arch: [x64]

publish:
  provider: github
  owner: Vex-Foundation
  repo: Vex
  # Zero-touch auto-publish on tag (owner decision 2026-08-05, starting v0.2.1):
  # the release is PUBLISHED as soon as the pipeline uploads the artifacts and
  # latest-mac.yml / latest-linux.yml — users' updaters see it immediately, with
  # no human artifact-review gate in between. Flip back to `draft` to restore
  # the manual review step.
  releaseType: release
