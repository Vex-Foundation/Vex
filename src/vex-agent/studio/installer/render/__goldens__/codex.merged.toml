# The user wrote this comment. A merge must not delete it.
theme = "dark"

[permission]
# FOREIGN AUTHORITY STATEMENT. Vex never writes this and never removes it.
allow = ["shell", "edit"]

[mcp_servers.other]
command = "/usr/bin/other"
args = ["--serve"]

[plugins]
enabled = true

[mcp_servers.vex]
command = "/home/user/.config/vex/bin/vex-mcp"
args = ["--project", "0f6b1c2e-8a4d-4f1b-9c3e-7d5a2b8e4c10"]
tool_timeout_sec = 3900
